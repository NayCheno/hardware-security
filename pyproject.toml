[project]
name = "hardware-security"
version = "0.1.0"
description = "Build tooling for the hardware security survey and slide report."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
build = "tools.build:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools"]

[tool.uv]
package = true
