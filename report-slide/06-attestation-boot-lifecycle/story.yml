direction: Attestation、boot、lifecycle
story_version: 1
slides:
- slide_id: d06-00-direction-intro
  paper_key: direction
  slide_type: direction_intro
  claim: Attestation、boot、lifecycle 的核心是先界定保护对象、管理边界和证据强度，再用三篇主讲材料串起技术演进。
  narrative:
  - 区分 secure boot、launch attestation、runtime/control-flow evidence、evidence profile 与 verifier policy。
  - 固定三篇主讲材料；`rats_rfc` 主讲 attestation architecture，`eat_rfc` 作为 token-format auxiliary；C-FLAT/LO-FAT/PDRIMA 作为 runtime-attestation lineage auxiliary。
  - 先讲方向痛点和设计轴，再逐篇说明贡献、限制、证据强度和可落地条件。
  - 对规范、Survey、draft、vendor evidence 保持显式标注，避免把背景材料写成一手系统证明。
  evidence_refs:
  - report-slide/06-attestation-boot-lifecycle/papers.yml direction metadata and primary selection slots.
  - survey/evidence_ledger.md Slide Primary Ledger and Evidence Classes.
  proof_object:
    type: comparison_matrix
    title: 三篇主讲材料的分工
    data:
      columns:
      - 论文
      - 定位
      - 证据边界
