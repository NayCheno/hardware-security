      - ["System lineage", "Keystone、Penglai、SPEAR-V、CoVE", "决定保护对象与 TCB 位置"]
      - ["Evidence matrix", "Table 1", "标出 secure I/O、SDK、验证和成熟度缺口"]
      - ["Open challenges", "Section 4", "连接后续标准化和商业落地判断"]
  source_note: "三层读法把 survey 内容转成 PPT 结构，不引入原文之外的机制结论。"

