- slide_id: d01-11-accel-summary
  paper_key: sok-tee
  slide_type: summary
  claim: "Wang/Huang 2026 的贡献是把 TEE taxonomy 从 CPU/enclave/CVM 推到 GPU、NPU、TPU、FPGA、DPU/SmartNIC 等 accelerator path。"
  narrative:
  - "动机：confidential workload 使用 accelerator 后，数据进入 driver、queue、device memory、I/O bus、firmware/controller 和 scheduler。"
  - "工作：分析 51 个 accelerator TEE studies，提出 Host-type、Acc.-type、Mix-type，并围绕 access control、memory encryption、attestation 组织设计空间。"
  - "关键统计：41/51 studies 在 2022 年之后提出，42/51 依赖 CPU TEE，40/51 支持特定 CPU architecture，43/51 只支持一种 accelerator。"
  - "在 01 中，它补齐 Li 2024 对 device path 覆盖不足的问题。"
  evidence_refs:
  - "Wang/Huang 2026 p.1 abstract and p.2-p.3 motivation."
  - "Wang/Huang 2026 p.2 Table I; p.4 Figure 1; p.6 Table III."
