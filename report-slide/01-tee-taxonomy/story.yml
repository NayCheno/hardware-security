- slide_id: d01-07-boubakri-background
  paper_key: boubakri2025riscvtee
  slide_type: background
  claim: "RISC-V TEE 的背景瓶颈是 substrate 丰富但成熟度不齐：PMP/ePMP、privilege stack、MMU、H-extension、MTT/TSM 并不自动组成可量产平台。"
  narrative:
  - "轻量 enclave 通常复用 PMP/ePMP 和 M-mode monitor，部署简单但受 region 数量、granularity 和 monitor 设计限制。"
  - "更强的系统会修改 page table walker、cache/memory metadata 或安全 monitor，带来移植和验证成本。"
  - "CoVE/AP-TEE 把问题提升到 confidential VM，需要 TVM、TSM、ABI、memory ownership 和 attestation 组合。"
  - "因此 01 不能把 RISC-V TEE 简化为一个系统，而要先分清 enclave lineage 与 confidential VM lineage。"
  evidence_refs:
  - "Boubakri 2025 p.4 Section 2.2: RISC-V architectural substrate."
  - "Boubakri 2025 p.12-p.13 Section 3.7 CoVE; p.17-p.18 Section 3.14 AP-TEE."
  proof_object:
    type: mechanism_flow
    title: "RISC-V TEE substrate"
    data:
      stages:
      - "U/S/M and HS privilege modes"
      - "PMP/ePMP memory regions"
      - "secure monitor or TSM"
      - "virtual memory / hypervisor extension"
      - "MTT/GPT/metadata ownership"
      - "TVM evidence and verifier decision"
  source_note: "机制链条按 Section 2.2、CoVE 和 AP-TEE 小节抽象，不替代规范细节。"

- slide_id: d01-08-boubakri-solution
  paper_key: boubakri2025riscvtee
  slide_type: solution
  claim: "这篇 survey 的核心用法是分层：primitive stack 决定隔离基础，system lineage 决定保护对象，open challenges 决定落地缺口。"
  narrative:
  - "Primitive stack：privilege mode、PMP/ePMP、MMU、H-extension、crypto 和 memory tagging 是 RISC-V TEE 的底座。"
  - "System lineage：Sanctum/Keystone 建立 open enclave，Penglai/CURE/SPEAR-V 展开 memory primitive 分支，CoVE/AP-TEE 走向 confidential VM。"
  - "Comparison matrix：Table 1 让读者看到 secure I/O、cache side-channel、implementation validation、SDK、TCB、compliance 的差距。"
  - "Open challenges：Section 4 把 fragmentation、programming model、standardization、production validation 作为后续研究入口。"
  evidence_refs:
