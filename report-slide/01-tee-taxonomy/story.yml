- slide_id: d01-12-accel-background
  paper_key: sok-tee
  slide_type: background
  claim: "CPU TEE 只保护 CPU-side execution/memory；一旦 workload offload，敏感数据和控制状态会跨过 device memory、DMA/MMIO、I/O link 和 firmware。"
  narrative:
  - "Figure 2 将 accelerator computing 分成 task preparation/termination 和 task computing 两阶段，攻击面贯穿数据准备、传输、计算、释放。"
  - "攻击目标包括 input/output、model parameters、task code、page table、metadata、driver/runtime 和 accelerator environment。"
  - "攻击来源可能是 host OS/hypervisor、malicious task、device/firmware adversary 或 link/physical adversary。"
  - "因此只讲 CPU TEE 的 memory ownership 不够，必须把 device identity、device memory、queue state 和 bus protection 纳入 taxonomy。"
  evidence_refs:
  - "Wang/Huang 2026 p.4-p.6 Figure 2 and Section IV: attack vectors."
  - "Wang/Huang 2026 p.1-p.4 Figure 1: accelerator TEE overview."
  proof_object:
    type: mechanism_flow
    title: "offload path attack surface"
    data:
      stages:
      - "CVM/enclave task prepares data/model"
      - "driver/runtime configures page table and queue"
      - "DMA/MMIO crosses I/O bus"
      - "accelerator memory stores plaintext or metadata"
      - "compute engine executes workload"
      - "output returns through host-visible path"
  source_note: "攻击面流程按 Figure 2 重绘，避免给出可执行攻击步骤。"

- slide_id: d01-13-accel-solution
  paper_key: sok-tee
  slide_type: solution
  claim: "Accelerator TEE 至少同时回答三件事：谁能访问设备路径，数据在哪些位置被保护，远程 verifier 如何确认设备身份和配置。"
  narrative:
  - "Architecture：Host-type 复用 CPU-side TEE；Acc.-type 把控制逻辑放进 accelerator；Mix-type 组合 CPU-side 与 device-side trust chain。"
  - "Access control：CPU TEE、TSM/RMM/firmware、I/O bus filter、accelerator controller 可能共同决定 DMA/MMIO 和 task access。"
  - "Memory protection：host memory、device memory、I/O link 和 security metadata 的粒度必须贴合 accelerator access pattern。"
  - "Attestation：CPU TEE report 不足以证明设备侧环境，还需要 accelerator HRoT、endorser、reference values 和 verifier policy。"
