direction: "硬件辅助 TEE taxonomy"
story_version: 1
slides:
- slide_id: d01-00-direction-intro
  paper_key: direction
  slide_type: direction_intro
  claim: "01 的任务不是罗列 SGX、SEV、TrustZone、CCA、CoVE，而是建立一张能解释 protected object、resource manager、evidence chain 和 device boundary 的总分类图。"
  narrative:
  - "TEE 的共同问题是：远程用户不信任平台管理者，但平台仍要调度 CPU、分配内存、处理 I/O，并给 verifier 提供可信证据。"
  - "本方向用 Li 2024 固定通用 server-side TEE runtime taxonomy，用 Boubakri 2025 补 RISC-V 开放 ISA 谱系，用 Wang/Huang 2026 补 accelerator/device TEE 边界。"
  - "三篇都是 SoK/Survey，因此只作为 design-space anchor；具体平台机制、协议状态和性能数字仍回到原始论文或官方规范。"
  - "讲法上先建立分类轴，再进入后续章节的 Arm CCA、RISC-V CoVE/AP-TEE、CoVE-IO、SPDM/TDISP、accelerator TEE。"
  evidence_refs:
  - "survey/evidence_ledger.md Slide Primary Ledger, 01-tee-taxonomy."
  - "Li 2024 p.3 Figure 2, p.5 Figure 3/Figure 4; Boubakri 2025 p.4 Figure 1, p.19 Table 1; Wang/Huang 2026 p.2 Table I, p.4 Figure 1."
  proof_object:
    type: comparison_matrix
    title: "01 的分类轴"
    data:
      columns: ["分类轴", "核心问题", "后续章节映射"]
      rows:
      - ["Protected object", "保护 enclave/CVM/Realm/device workload 的哪一段状态", "TrustZone、CCA、CoVE、accelerator TEE"]
      - ["Resource manager", "host、RTPM/RMM/TSM、TEE instance 或 device controller 谁管资源", "runtime、memory ownership、interrupt、I/O"]
      - ["Evidence chain", "attestation report 覆盖哪些初始状态和配置", "RATS、CCA token、TVM/device evidence"]
      - ["Device boundary", "数据离开 CPU TEE 后是否仍有身份、隔离和加密", "CoVE-IO、SPDM/TDISP、IDE、DPU/GPU"]
  source_note: "本页用三篇 SoK/Survey 建立方向边界，不把它们当作一手机制证据。"

- slide_id: d01-01-li-summary
  paper_key: li2024sokteechoices
  slide_type: summary
  claim: "Li 2024 的核心贡献是 TRAF：把 TEE 生命周期和 CPU/memory/I/O runtime event 映射到四种 resource-management mode。"
  narrative:
  - "动机：server-side TEEs 设计差异大，读者只按产品名学习会看不清 host、TCB、TEE instance 的职责边界。"
  - "工作：提出 TEE Runtime Architectural Framework，先分 remote attestation 与 runtime management，再分析 CPU、memory、I/O 事件。"
  - "关键设计：unprotected、RTPM-only、RTPM-guarded、instance-assisted 四种 mode 解释安全、可管理性和 TCB 规模之间的取舍。"
  - "在本报告中，它是 01 的主 taxonomy anchor，但不替代平台论文或官方规范。"
  evidence_refs:
  - "Li 2024 p.1 abstract and p.2 contributions."
  - "Li 2024 p.3 Figure 2; p.5 Figure 3/Figure 4; p.7 Figure 5."
  proof_object:
    type: mechanism_flow
    title: "TRAF 分析管线"
    data:
      stages:
      - "TEE lifecycle: attestation vs runtime"
      - "runtime event: CPU / memory / I/O"
      - "manager: host / RTPM / TEE instance"
      - "mode: unprotected / only / guarded / assisted"
      - "implication: security / TCB / manageability"
      - "pitfall mapping: design flaw -> known attack"
  source_note: "机制图按 Li 2024 Figure 2-Figure 5 重绘。"

- slide_id: d01-02-li-background
  paper_key: li2024sokteechoices
  slide_type: background
  claim: "TEE 的根本矛盾是：host 被 threat model 视为不可信，却仍必须管理调度、页表、I/O 和实例生命周期。"
  narrative:
  - "论文把 Secure Remote Execution 目标写成 secure measurement、confidentiality、integrity；这些保证依赖 hardware-backed TCB。"
  - "攻击者模型假设 adversary 可控制 privileged software，并管理 non-TEE world 的 memory mapping、I/O devices 和 CPU scheduling。"
  - "remote attestation 只能证明初始状态；运行中是否安全，取决于每个 runtime event 的管理权如何被限制。"
  - "商业 TEE 常排除 DoS 和 microarchitectural side-channel，因此页面需要显式标出安全边界。"
  evidence_refs:
  - "Li 2024 p.2 Section 2.1: Secure Remote Execution properties."
  - "Li 2024 p.3 Section 2.2: threat model and excluded attack classes."
  proof_object:
    type: comparison_matrix
    title: "三条必须先讲清的边界"
    data:
      columns: ["边界", "谁参与", "为什么影响 taxonomy"]
      rows:
      - ["Trust boundary", "host vs TCB vs TEE instance", "决定 attacker 能操作哪些资源"]
      - ["TCB boundary", "manufacturer TCB vs ISV TCB", "决定漏洞责任和验证范围"]
      - ["Evidence boundary", "attestation/spec/paper", "决定 verifier 可以相信什么"]
  source_note: "背景页强调 threat model 和 evidence boundary，避免把 SoK 写成平台安全证明。"

- slide_id: d01-03-li-solution
  paper_key: li2024sokteechoices
  slide_type: solution
  claim: "TRAF 的妙处是把“TEE 安不安全”转成“这个 runtime event 由谁管理、谁校验、谁承担 TCB 成本”。"
  narrative:
  - "CPU scheduling 多为 unprotected mode，因为云平台需要调度效率；但 host 可通过中断和调度观察 workload。"
  - "context switch 多为 RTPM-only mode，因为寄存器和处理器状态必须由 TCB 保存/恢复。"
  - "memory allocation、page fault、virtual memory 常在 guarded 与 assisted mode 之间取舍，是 corner case 高发区域。"
  - "I/O data transmission 在很多 TEE 中仍依赖 unprotected path 或应用层保护，直接引出 trusted I/O 和 device attestation 章节。"
  evidence_refs:
  - "Li 2024 p.5 Figure 4: four resource-management modes."
  - "Li 2024 p.6 Section 4.3; p.7-p.8 Section 4.4; p.8 Section 4.5."
  proof_object:
    type: comparison_matrix
    title: "四种 management mode"
    data:
      columns: ["Mode", "谁主导", "收益", "风险"]
      rows:
      - ["Unprotected", "host", "资源管理简单", "观察和操控面最大"]
      - ["RTPM-only", "TCB/RTPM", "安全边界清楚", "TCB 变大、复杂度升高"]
      - ["RTPM-guarded", "host + TCB check", "兼顾可管理性", "校验遗漏形成漏洞"]
      - ["Instance-assisted", "TEE instance runtime", "减少 host 观察面", "runtime 复杂度和 DoS 风险"]
  source_note: "矩阵按 Figure 4 和 Section 4 的 CPU/memory/I/O event 说明重绘。"

- slide_id: d01-04-li-experiments
  paper_key: li2024sokteechoices
  slide_type: experiments
  claim: "这是一篇 SoK，无新实验；它能支撑 taxonomy、coverage 和 pitfall framing，不能单独支撑某个平台的安全或性能结论。"
  narrative:
  - "证据对象是 Figure 1-Figure 5、Table 1、Appendix Table 2，以及作者对代表性 TEE 和 known attacks 的整理。"
  - "Figure 5 把多种 TEE 的 CPU、memory、I/O event 映射到四种 mode，说明同一分类轴可跨平台比较。"
  - "Table 1 把 vulnerable design flaws 与 known attacks 对齐，用于解释 pitfall，不用于证明某平台已修复或已量产。"
  - "PPT 中具体机制、协议状态和数值必须回到原始平台论文、官方规范或厂商资料。"
  evidence_refs:
  - "Li 2024 p.7 Figure 5: representative TEE design-choice matrix."
  - "Li 2024 p.9 Table 1 and Appendix Table 2: vulnerable design flaws and attack catalog."
  proof_object:
    type: comparison_matrix
    title: "证据使用边界"
    data:
      columns: ["证据对象", "可支撑", "不可支撑"]
      rows:
      - ["Figure 3/4", "runtime event 与 mode 分类", "单个平台正确性"]
      - ["Figure 5", "跨平台 design-choice 对比", "同等级安全排序"]
      - ["Table 1/2", "pitfall 与攻击类型映射", "修复状态或生产状态"]
      - ["SoK status", "研究框架", "新系统实验"]
  source_note: "实验页保守表述：SoK，无新实验。"

- slide_id: d01-05-li-evaluation
  paper_key: li2024sokteechoices
  slide_type: evaluation
  claim: "评价：Li 2024 是 01 最适合的主线语言；作为 SoK，无新实验，落地价值在 checklist，而不是直接给平台背书。"
  narrative:
  - "优势：把产品名转换成 host/RTPM/instance 分工，适合贯穿后续 Arm、RISC-V、I/O 和 accelerator 章节。"
  - "局限：范围偏 server-side general-purpose CPU TEE，不完整覆盖 embedded TrustZone、纯软件 TEE 和 accelerator/device TEE。"
  - "商业化潜力：可转为 cloud TEE 选型 checklist、verifier policy checklist、architecture review 表。"
  - "使用原则：用它解释分类和风险来源；平台机制、部署状态和采购判断仍需一手证据补强。"
  evidence_refs:
  - "Li 2024 p.2-p.3 scope and threat model."
  - "Li 2024 p.12 Section 6: discussion and limitations."
  proof_object:
    type: comparison_matrix
    title: "文章评价"
    data:
      columns: ["维度", "判断"]
      rows:
      - ["设计优势", "TRAF 抽象清楚，可统一解释 CPU/memory/I/O runtime event"]
      - ["主要局限", "不是平台机制证明，device path 覆盖不足"]
      - ["商业落地", "高：适合作为架构审查和 verifier policy checklist"]
      - ["讲稿定位", "主 taxonomy anchor，不作性能或生产状态证据"]
  source_note: "评价结合论文 scope/limitation 与本仓库 evidence ledger 的 E2 边界。"

- slide_id: d01-06-boubakri-summary
  paper_key: boubakri2025riscvtee
  slide_type: summary
  claim: "Boubakri 2025 的作用是把 RISC-V TEE 从 PMP/monitor enclave 串到 CoVE/AP-TEE confidential VM 谱系。"
  narrative:
  - "动机：RISC-V 的开放性带来可定制安全硬件，也带来 secure enclave、TEE、CVM、monitor、runtime 的术语碎片化。"
  - "工作：按 RISC-V primitives、representative systems、comparison matrix 和 open challenges 组织 2016-2025 谱系。"
  - "关键材料：Figure 1 给 timeline，Table 1 横向比较 isolation、memory、secure I/O、TCB、SDK、compliance。"
  - "在 01 中，它是 RISC-V branch 的辅助 SOTA；具体 Keystone/Penglai/SPEAR-V/CoVE/AP-TEE 机制仍回原始材料。"
  evidence_refs:
  - "Boubakri 2025 p.1 abstract and p.4 Section 2.3."
  - "Boubakri 2025 p.4 Figure 1; p.19 Table 1."
  proof_object:
