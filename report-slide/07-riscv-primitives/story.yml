direction: RISC-V 基础安全 primitives
story_version: 1
slides:
- slide_id: d07-00-direction-intro
  paper_key: direction
  slide_type: direction_intro
  claim: RISC-V 基础安全 primitives 的核心是先界定保护对象、管理边界和证据强度，再用三篇主讲材料串起技术演进。
  narrative:
  - 把 PMP/ePMP/Smepmp、IOMMU、IOPMP、AIA、CFI 等 substrate 与 TEE 本体区分开。
  - 固定三篇主讲材料；`riscv_iopmp_2026` 与 `manoni2026cva6cfi` 作为辅助材料，不计入三篇主讲。
  - 先讲方向痛点和设计轴，再逐篇说明贡献、限制、证据强度和可落地条件。
  - 对规范、Survey、draft、vendor evidence 保持显式标注，避免把背景材料写成一手系统证明。
  evidence_refs:
  - report-slide/07-riscv-primitives/papers.yml direction metadata and primary selection slots.
  - survey/evidence_ledger.md Slide Primary Ledger and Evidence Classes.
  proof_object:
    type: comparison_matrix
    title: 三篇主讲材料的分工
    data:
      columns:
      - 论文
      - 定位
      - 证据边界
      rows:
