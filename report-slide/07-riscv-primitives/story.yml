        - 开创/基础入口
        - E0 / 基础证据 standard substrate
      - - RISC-V IOMMU
        - 代表性改进
        - E0 / Spec-standard SOTA
      - - RISC-V Advanced Interrupt Architecture
        - 当前 SOTA/补充边界
        - E0 / Spec-standard SOTA
  source_note: 来源：三篇主讲材料选择、评价字段与 evidence ledger｜证据等级：方向综述
