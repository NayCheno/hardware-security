direction: Memory encryption / integrity / replay protection
focus: 避免把 access control、ownership、encryption、integrity、freshness/replay 混写。
selection_rule: 固定三篇 primary；`riscv_ap_tee_2024` 作为 AP-TEE/CoVE lifecycle auxiliary，不计入三篇主讲。
primary:
- key: li2025aiore
  role: sota_1
  selection_slot: primary_1
  paper_type: system
  claim_strength: E1
  selection_reason: AIORE (MICRO 2025) is the SOTA for CXL memory encryption, achieving only 3.7% overhead with adaptive CTR/XTS encryption and incremental offloaded re-encryption.
  evidence_type: E1 peer-reviewed primary work
  maturity: peer-reviewed primary work
  pdf_status: source_verified
  source_url: https://doi.org/10.1145/3725843.3756119
  evidence: E1 / Peer-reviewed SOTA
  source_status: source_verified
  reference: reference/memory-encryption-integrity-replay/efficient-security-support-for-cxl-memory-through-adaptive-incremental-offloaded-re-encryption/paper.pdf
  title: 'AIORE: Efficient Security Support for CXL Memory through Adaptive Incremental Offloaded (Re-)Encryption'
  auxiliary: []
  slides:
    summary:
      claim: 提出 AIORE 框架，通过自适应 CTR/XTS 加密和增量卸载重加密，将 CXL 内存安全开销降至 3.7%
      points:
      - 自适应 CTR/XTS 加密选择
      - 增量重加密减少额外开销
      - 卸载重加密到内存节点
      visual:
        title: 证据定位
        items:
        - 槽位：primary_1
        - 类型：system
        - 证据：E1 / Peer-reviewed SOTA
        - 来源：source_verified
    background:
      claim: CXL 内存扩展带来安全挑战，现有 XTS 加密在内存密集型应用中开销高达 14.9%
      points:
      - CXL 内存扩展带来安全挑战
      - XTS 加密在读操作关键路径上开销高
      - CTR 模式的计数器缓存污染和溢出重加密问题
      visual:
        title: 问题边界
        items:
        - 保护对象
        - 攻击/管理边界
        - 现有方法缺口
    solution:
      claim: AIORE 通过页热度和自适应加密、增量重加密、卸载重加密三个设计，实现高效安全 CXL 内存
      points:
      - 页热度感知自适应加密选择
      - 增量重加密利用程序固有访问
      - 卸载重加密到 CXL 内存节点
      visual:
        title: 关键机制
        items:
        - Page hotness tracker
        - Incremental re-encryption bitmap
        - Offloaded re-encryption at memory node
    experiments:
      claim: MICRO 2025 peer-reviewed paper，Gem5 模拟器评估，相比基线平均减少 62.8% 安全开销
      points:
      - MICRO 2025 peer-reviewed
      - Gem5 模拟器评估 13 个负载
      - 平均开销仅 3.7%（单核 3.2%，多核 4.3%）
      visual:
        title: 证据强度
        items:
        - 类型：E1 peer-reviewed primary work
        - 成熟度：peer-reviewed primary work
        - PDF：source_verified
    evaluation:
      claim: CXL 内存加密的当前 SOTA，将安全开销从 14.9% 降至 3.7%
      strengths: CXL 内存加密的当前 SOTA，自适应性设计和卸载重加密创新性强。
      limitations: 模拟器评估，需真实硬件验证；不覆盖 CXL 完整性树的完整设计。
      commercialization: 适合 CXL 内存安全产品化；落地依赖 CXL 硬件成熟度和计数器缓存设计。
- key: rogers2007bonsai
  role: peer_reviewed_mechanism_anchor
  selection_slot: primary_2
  paper_type: system
  claim_strength: E1
  selection_reason: Peer-reviewed Bonsai Merkle Tree mechanism anchor for memory integrity, freshness, and replay protection.
  evidence_type: E1 peer-reviewed primary paper
  maturity: peer-reviewed primary paper
  pdf_status: local_pdf_verified
  source_url: https://doi.org/10.1109/MICRO.2007.16
  evidence: E1 / Peer-reviewed mechanism anchor
  source_status: local_pdf_verified
  reference: reference/architecture-and-platform-security/address-independent-seed-encryption-bonsai-merkle-trees/paper.pdf
  title: Bonsai Merkle Trees for memory integrity and freshness
  auxiliary:
  - suh2003aegis
  - suh2003memoryintegrity
  slides:
    summary:
      claim: Bonsai Merkle Trees use counter/tree metadata to detect tamper and replay, anchoring memory freshness evidence.
      points:
      - Counter/tree metadata detects tamper and replay
      - Provides peer-reviewed evidence for memory integrity and freshness
      visual:
        title: Evidence position
        items:
        - 'slot: primary_2'
        - 'type: system'
        - 'evidence: E1 / Peer-reviewed mechanism anchor'
        - 'source: local_pdf_verified'
    background:
      claim: Encryption alone cannot detect stale or modified memory values returned by an untrusted memory system.
      points:
      - Encryption alone cannot detect stale or modified memory values
      - Freshness requires integrity trees, counters, or authenticated roots
      visual:
        title: Problem boundary
        items:
        - memory tamper
        - stale-data replay
        - OS/performance-friendly metadata
    solution:
      claim: Address-independent seed encryption and Bonsai Merkle Trees reduce secure-processor integrity-tree overhead.
      points:
      - Address-independent seed encryption reduces OS friction
      - Bonsai Merkle Trees authenticate counter metadata and root state
      visual:
        title: Mechanism view
        items:
        - AISE counter-mode seed
        - BMT over encryption counters
        - root MAC for replay/tamper detection
    experiments:
      claim: MICRO 2007 peer-reviewed paper reports secure-processor simulation results and reduced memory-integrity overhead.
      points:
      - MICRO 2007 peer-reviewed secure-processor simulation
      - Historical performance numbers are lineage evidence, not direct CCA/SEV-SNP product comparison
      visual:
        title: Evidence strength
        items:
        - 'type: E1 peer-reviewed primary paper'
        - 'maturity: peer-reviewed primary paper'
        - 'PDF: local_pdf_verified'
    evaluation:
      claim: Moves the section anchor from vendor/spec contrast back to peer-reviewed memory-integrity and freshness mechanisms.
      strengths: Moves the section anchor from vendor/spec contrast back to peer-reviewed memory-integrity and freshness mechanisms.
      limitations: Secure-processor lineage is not the same as a modern confidential-VM product; deployment claims still need SEV-SNP, TDX, CCA, or CoVE evidence.
      commercialization: Useful for memory-controller integrity-tree design; productization depends on metadata storage, root protection, and performance budget.
